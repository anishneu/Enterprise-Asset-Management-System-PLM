services:

  keycloak:
      image: quay.io/keycloak/keycloak:26.2
      container_name: keycloak
      environment:
        KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
        KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      command:
        - start-dev
        - --import-realm

      ports:
        - "8080:8080"

      volumes:
      - ./keycloak/amsrealm-realm.json:/opt/keycloak/data/import/amsrealm-realm.json
      - ./keycloak/themes:/opt/keycloak/themes


  mysql-db:
    image: mysql:8.4
    container_name: dockermysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d


  backend:
    build: ./backend

    ports:
      - "8000:8000"

    environment:
      # Docker network overrides — everything else comes from root .env via Compose
      DB_HOST: mysql-db
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}

    depends_on:
      - mysql-db
      - keycloak


  frontend:
      build: ./frontend
      container_name: frontend
      image: frontendimg

      ports:
        - "3000:3000"

      environment:
        REACT_APP_API_URL: ${REACT_APP_API_URL}
        REACT_APP_KEYCLOAK_URL: ${REACT_APP_KEYCLOAK_URL}
        REACT_APP_KEYCLOAK_REALM: ${REACT_APP_KEYCLOAK_REALM}
        REACT_APP_KEYCLOAK_CLIENT_ID: ${REACT_APP_KEYCLOAK_CLIENT_ID}

      depends_on:
        - backend
        - keycloak

      volumes:
        - ./frontend:/app
        - /app/node_modules

      command: npm start

volumes:
  mysql_data:
