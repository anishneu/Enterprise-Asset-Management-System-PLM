name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          REACT_APP_API_URL: http://localhost:8000/api
          REACT_APP_KEYCLOAK_URL: http://localhost:8080
          REACT_APP_KEYCLOAK_REALM: amsrealm
          REACT_APP_KEYCLOAK_CLIENT_ID: ams-react
        run: npm run build

      - name: Test
        env:
          CI: true
        run: npm test -- --watchAll=false --passWithNoTests

  backend:
    name: Backend check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import smoke test
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: authdb
          DB_USER: test
          DB_PASSWORD: test
          KEYCLOAK_URL: http://localhost:8080
          KEYCLOAK_REALM: amsrealm
          KEYCLOAK_CLIENT_ID: ams-react
          KEYCLOAK_ADMIN: admin
          KEYCLOAK_ADMIN_PASSWORD: admin123
          CORS_ORIGINS: http://localhost:3000
        run: python -c "from main import app; assert app is not None"

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create env file for Compose
        run: cp .env.example .env

      - name: Build images
        run: docker compose build backend frontend
